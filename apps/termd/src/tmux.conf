# tmux settings for agentbox terminals (tmux -L agentbox).
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"
set -g history-limit 50000
set -g mouse on
# AI CLIs need Esc to arrive at once, not after tmux's escape delay.
set -s escape-time 0
set -g focus-events on
set -g set-clipboard on
# Several devices can attach; size the window to the one used last.
set -g window-size latest
set -g aggressive-resize on
# The browser shows the session name, so keep tmux's own bar out of the way.
set -g status off
# Closing the browser detaches; the session keeps running.
set -g destroy-unattached off
set -g exit-empty off
# New windows (Ctrl-b c) get the same non-login shell as new sessions.
set -g default-command 'exec "$SHELL"'
